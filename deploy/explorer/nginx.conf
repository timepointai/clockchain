# Server block for the static explorer. Included by the base image's
# /etc/nginx/nginx.conf, which already maps .wasm to application/wasm, keeps
# its pid and temp files under /tmp and runs as the unprivileged nginx user.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;
    # Fly terminates TLS; a directory redirect must not name an http:// origin.
    absolute_redirect off;

    # The page's own meta CSP carries the resource policy. These headers add
    # what a meta tag cannot express (frame-ancestors) and the usual hardening.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # dist/ file names are not content-hashed, so every use revalidates.
    add_header Cache-Control "no-cache" always;

    # Fly's HTTP check.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
