name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The test rig hits a REAL Postgres (no mocks). Both point at the service below.
  DATABASE_URL: postgres://clockchain:clockchain@localhost:5432/clockchain
  TEST_DATABASE_URL: postgres://clockchain:clockchain@localhost:5432/clockchain

jobs:
  check:
    name: fmt · clippy · test (real Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clockchain
          POSTGRES_PASSWORD: clockchain
          POSTGRES_DB: clockchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clockchain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      # The consensus rule must be "same Φ everywhere" as a BUILD property: the
      # crates that compile to the embedded wasm mirror must stay wasm-clean, so
      # a stray non-wasm dependency (sqlx, a clock, an RNG) is a compile error
      # here, not only a review comment.
      - name: Wasm purity (cc-core + cc-filter compile to wasm32)
        run: cargo build -p cc-core -p cc-filter --target wasm32-unknown-unknown

      # Stage (e): the shipped rule-identity code must reproduce the independent
      # reference vectors inside wasm32 as well as natively (Cargo test).
      - name: Wasm rule-vector agreement
        run: |
          cargo build -p cc-wasm-vectors --target wasm32-unknown-unknown
          node crates/cc-wasm-vectors/check.mjs target/wasm32-unknown-unknown/debug/cc_wasm_vectors.wasm

      # Stage (g) G6: the in-browser verifier keeps a wasm-clean runtime tree
      # (no database, runtime, network or RNG crate), builds for wasm32, and the
      # explorer's tests drive that build against the recorded synthetic fixture
      # (including an empty host-import table).
      - name: Wasm verifier and explorer
        run: |
          tree="$(cargo tree -p cc-wasm-verify -e normal --target wasm32-unknown-unknown --prefix none)"
          if printf '%s\n' "$tree" | grep -E '^(sqlx|tokio|reqwest|hyper|axum|getrandom|rand|cc-ledger|cc-node|cc-testkit) '; then
            echo "cc-wasm-verify runtime tree is not wasm-clean" >&2; exit 1
          fi
          cargo build -p cc-wasm-verify --target wasm32-unknown-unknown --release
          node --test web/explorer/test/*.test.mjs

      # The stdlib reference must reproduce the committed vectors byte for byte.
      - name: Rule-vector reference reproduces committed vectors
        run: |
          python3 crates/cc-core/tests/vectors/v1_rule_reference.py
          git diff --exit-code crates/cc-core/tests/vectors/v1-rule.txt crates/cc-ledger/tests/vectors/v1-view.txt

      - name: Test (against the Postgres service)
        run: cargo test --all

      - name: Build operator integration-test binary
        run: cargo build -p cc-node --bin cc-node

      - name: Install operator test dependency
        run: python3 -m pip install -r ops/requirements.txt

      - name: Offline evaluation contract
        run: python3 -m unittest discover -s ops -p 'test_*.py'

  stage0:
    name: Stage 0 · model and mutants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reference-model dependency
        run: python -m pip install -r docs/design/stage0/requirements.txt
      - name: Fast bound and depth checks
        run: >-
          python docs/design/stage0/check.py --max-events 5 --examples 300
          --depth-examples 1000 --output "$RUNNER_TEMP/stage0-fast.json"
      - name: Kill all one-rule mutants
        run: >-
          python docs/design/stage0/mutants.py
          --output "$RUNNER_TEMP/stage0-mutants.json"
      - name: Retain reference-model receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-receipts
          path: ${{ runner.temp }}/stage0-*.json
          if-no-files-found: error
